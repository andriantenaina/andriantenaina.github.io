name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Dependabot update PRs are built (not deployed) so a broken upgrade never reaches the site.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Explicit label (not ubuntu-latest) so image migrations never change the build unannounced.
    runs-on: ubuntu-26.04
    env:
      SITE_URL: https://andriantenaina.github.io
      PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # CV PDFs and share images are generated locally (npm run assets) and committed, so no Chrome step here.
      - run: npm run build -w pro && npm run build -w creative && node shared/scripts/merge-sites.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pro/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
